# =============================================
# 01-secrets.yaml
# কাজ: MySQL password ও Flask secret key সংরক্ষণ করা
#
# ⚠️ IMPORTANT: apply করার আগে নিচের base64 ভ্যালুগুলো
# অবশ্যই বদলে দিন। কমান্ড: echo -n "yourpassword" | base64
# =============================================
apiVersion: v1
kind: Secret
metadata:
  name: myflaskvuejsproject-secrets
  namespace: myflaskvuejsproject
type: Opaque
data:
  # echo -n "rootpass123" | base64  -> এই মান বদলান
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3MxMjM=
  # echo -n "appuser" | base64
  MYSQL_USER: YXBwdXNlcg==
  # echo -n "apppass123" | base64  -> এই মান বদলান
  MYSQL_PASSWORD: YXBwcGFzczEyMw==
  # echo -n "flaskvuedb" | base64
  MYSQL_DATABASE: Zmxhc2t2dWVkYg==
  # echo -n "change-this-flask-secret-key" | base64  -> অবশ্যই বদলান
  FLASK_SECRET_KEY: Y2hhbmdlLXRoaXMtZmxhc2stc2VjcmV0LWtleQ==
 